server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://koonj-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri /index.html;
    }
}
