spring.application.name=koonj-api
spring.threads.virtual.enabled=true
spring.datasource.url=${KOONJ_JDBC_URL:jdbc:postgresql://localhost:5432/koonj}
spring.datasource.username=${KOONJ_DB_USER:koonj}
spring.datasource.password=${KOONJ_DB_PASSWORD:password}
spring.jackson.deserialization.fail-on-unknown-properties=true
