spring:
  application:
    name: koonj-server
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: ${KOONJ_REPORT_TIMEOUT:10m}
  datasource:
    url: "${KOONJ_DB_URL:jdbc:postgresql://localhost:5432/koonj?reWriteBatchedInserts=true}"
    username: ${KOONJ_DB_USERNAME:koonj}
    password: ${KOONJ_DB_PASSWORD:koonj_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KOONJ_AUTH_ISSUER_URI:http://localhost:8180/realms/koonj}"
          jwk-set-uri: "${KOONJ_AUTH_JWK_SET_URI:http://localhost:8180/realms/koonj/protocol/openid-connect/certs}"
          audiences: koonj-server
  rabbitmq:
    host: ${KOONJ_TRANSFER_RABBIT_HOST:${KOONJ_RABBITMQ_HOST:localhost}}
    port: ${KOONJ_TRANSFER_RABBIT_PORT:${KOONJ_RABBITMQ_PORT:5672}}
    username: ${KOONJ_TRANSFER_RABBIT_USERNAME:${KOONJ_RABBITMQ_USERNAME:guest}}
    password: ${KOONJ_TRANSFER_RABBIT_PASSWORD:${KOONJ_RABBITMQ_PASSWORD:guest}}
    virtual-host: ${KOONJ_TRANSFER_RABBIT_VHOST:${KOONJ_RABBITMQ_VHOST:/}}
    ssl:
      enabled: ${KOONJ_TRANSFER_RABBIT_SSL:${KOONJ_RABBITMQ_SSL:false}}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${KOONJ_DDL_AUTO:update}


management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    tracing:
      export:
        enabled: false
      headers:
        Authorization: "${OPENOBSERVE_AUTHORIZATION:}"
    metrics:
      export:
        enabled: false
        headers:
          Authorization: "${OPENOBSERVE_AUTHORIZATION:}"

springdoc:
  swagger-ui:
    path: /swagger-ui/start

koonj:
  transfer:
    embedded-jobs: ${KOONJ_TRANSFER_EMBEDDED_JOBS:1}
    case-insensitive-mounts: ${KOONJ_TRANSFER_CASE_INSENSITIVE_MOUNTS:true}
    mounted-domain: ${KOONJ_TRANSFER_MOUNTED_DOMAIN:default}
    storage-aliases: "${KOONJ_TRANSFER_STORAGE_ALIASES:}"
    rabbit:
      enabled: ${KOONJ_TRANSFER_RABBIT_ENABLED:false}
      relay-enabled: ${KOONJ_TRANSFER_RELAY_ENABLED:true}
      worker-enabled: ${KOONJ_TRANSFER_WORKER_ENABLED:true}
      worker-pool: ${KOONJ_TRANSFER_WORKER_POOL:default}
      mount-pools: "${KOONJ_TRANSFER_MOUNT_POOLS:}"
      background-workers: ${KOONJ_TRANSFER_BACKGROUND_WORKERS:2}
      interactive-workers: ${KOONJ_TRANSFER_INTERACTIVE_WORKERS:1}
      tenant-jobs: ${KOONJ_TRANSFER_TENANT_JOBS:2}
      tenant-interactive-jobs: ${KOONJ_TRANSFER_TENANT_INTERACTIVE_JOBS:1}
      backend-jobs: ${KOONJ_TRANSFER_BACKEND_JOBS:8}
  observability:
    openobserve-url: "${KOONJ_OPENOBSERVE_URL:}"
    openobserve-organization: "${KOONJ_OPENOBSERVE_ORGANIZATION:default}"
    logs-endpoint: "${KOONJ_OTLP_LOGS_ENDPOINT:}"
  security:
    allowed-origins: "${KOONJ_CORS_ALLOWED_ORIGINS:http://localhost:5173}"
    basic-auth:
      enabled: ${KOONJ_BASIC_AUTH_ENABLED:false}
      username: "${KOONJ_BASIC_AUTH_USERNAME:}"
      password: "${KOONJ_BASIC_AUTH_PASSWORD:}"
      role: "${KOONJ_BASIC_AUTH_ROLE:KOONJ_VIEWER}"
  notifications:
    limits:
      cataloged-files: ${KOONJ_QUOTA_CATALOGED_FILES:0}
      storage-connections: ${KOONJ_QUOTA_STORAGE_CONNECTIONS:0}
      transfer-concurrency: ${KOONJ_QUOTA_TRANSFER_CONCURRENCY:0}
      license-expires-at: "${KOONJ_LICENSE_EXPIRES_AT:}"
      license-grace-ends-at: "${KOONJ_LICENSE_GRACE_ENDS_AT:}"
      check-interval: ${KOONJ_NOTIFICATION_LIMIT_CHECK_INTERVAL:1m}
