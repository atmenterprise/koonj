name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend Validation (koonj-server)
  # ---------------------------------------------------------------------------
  server-ci:
    name: Build & Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify & Compile Server
        run: |
          mvn -B -ntp clean test-compile -pl koonj-server -am

      - name: Run Unit Tests
        run: |
          mvn -B -ntp test -pl koonj-server

      - name: Package Server JAR
        run: |
          mvn -B -ntp package -DskipTests -pl koonj-server

      - name: Upload Server JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koonj-server-jar
          path: koonj-server/target/koonj-server-*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend Validation (koonj-ui)
  # ---------------------------------------------------------------------------
  ui-ci:
    name: Build & Test UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: koonj-ui/package-lock.json

      - name: Install Dependencies
        working-directory: koonj-ui
        run: npm ci --no-audit --no-fund

      - name: Type Check & Build
        working-directory: koonj-ui
        run: npm run build

      - name: Run UI Tests
        working-directory: koonj-ui
        run: npm test

      - name: Upload UI Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koonj-ui-dist
          path: koonj-ui/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Package & Docker Validation
  # ---------------------------------------------------------------------------
  package-validation:
    name: Test Packaging & Docker Build
    needs: [server-ci, ui-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: koonj-ui/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Deployment ZIP
        run: mvn -B -ntp -pl koonj-assembly -am clean package -DskipTests

      - name: Verify Deployment ZIP
        run: |
          unzip -q koonj-assembly/target/koonj-*-deployment.zip -d dist
          cd dist/koonj-*/
          cmp docker/server/koonj-server.jar on-premise/lib/koonj-server.jar
          cmp docker/fuse/koonj-fuse.jar on-premise/lib/koonj-fuse.jar
          cmp docker/ui/index.html on-premise/web/index.html
          test -x docker/setup-host-mount.sh
          test -f docker/samba/smb.conf
          test -f docker/samba/start.sh
          test -x on-premise/bin/run-koonj-fuse.sh
          test -f on-premise/bin/run-koonj-fuse.ps1
          test -x on-premise/install.sh
          test -x on-premise/bin/koonj-server.sh
          test -f on-premise/install.cmd

      - name: Test Building Production Docker Images
        run: |
          cd dist/koonj-*/docker
          docker compose --env-file .env.example --profile smb -f docker-compose.yml config -q
          OPENOBSERVE_ROOT_EMAIL=ci@example.com OPENOBSERVE_ROOT_PASSWORD=ci-config-only \
            OPENOBSERVE_AUTHORIZATION='Basic Y2k=' \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.otel.yml config -q
          docker build -t koonj-server:test -f server/Dockerfile.server server/
          docker build -t koonj-ui:test -f ui/Dockerfile.ui ui/
          docker build -t koonj-fuse:test -f fuse/Dockerfile.fuse fuse/
