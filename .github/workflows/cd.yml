name: CD / Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Packages & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: koonj-ui/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' for internal artifact naming if present
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Build and Extract Deployment ZIP
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mvn -B -ntp -pl koonj-assembly -am clean package "-Ddeployment.version=$RELEASE_VERSION"
          unzip -q "koonj-assembly/target/koonj-$RELEASE_VERSION-deployment.zip" -d dist

      - name: Build & Push Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: dist/koonj-${{ steps.meta.outputs.version }}/docker/server
          file: dist/koonj-${{ steps.meta.outputs.version }}/docker/server/Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/server:latest

      - name: Build & Push UI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: dist/koonj-${{ steps.meta.outputs.version }}/docker/ui
          file: dist/koonj-${{ steps.meta.outputs.version }}/docker/ui/Dockerfile.ui
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ui:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/ui:latest

      - name: Generate Checksums
        working-directory: koonj-assembly/target
        run: |
          sha256sum koonj-*-deployment.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Koonj Release ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            koonj-assembly/target/koonj-*-deployment.zip
            koonj-assembly/target/SHA256SUMS.txt
