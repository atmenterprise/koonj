name: PR Title Check

# Validates that every pull-request title conforms to the Conventional Commits
# spec (https://www.conventionalcommits.org/).  release-please reads merged
# commit messages (which default to the PR title on squash-merge) to decide
# the next semver bump and to build the CHANGELOG, so a valid title is
# required for the automated release pipeline to work correctly.
#
# Allowed types:
#   feat     → triggers a MINOR version bump
#   fix      → triggers a PATCH version bump
#   perf     → triggers a PATCH version bump
#   revert   → triggers a PATCH version bump
#   docs, style, refactor, test, build, ci, chore → no version bump
#
# A BREAKING CHANGE footer or a '!' after the type (e.g. feat!: …) triggers a
# MAJOR version bump regardless of type.
#
# Why `pull_request` and not `pull_request_target`:
#   This workflow only reads the PR title — it never checks out or executes code
#   from the PR branch — so `pull_request` is correct and safe for public forks.
#   `pull_request_target` causes "Resource not accessible by integration" errors
#   on repos/organisations that restrict elevated token access for that event.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

# Minimal permissions: only read PR metadata to validate the title.
permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types that are allowed in PR titles
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scopes are optional but encouraged, e.g. feat(server): …
          requireScope: false
          # Subject must start with a lowercase letter
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter.
            Example: "feat(server): add retry on 5xx responses"
          # Allow wip: titles on draft PRs only
          wip: true
          # Do not force single-commit PRs to match — the PR title is enough
          validateSingleCommit: false
