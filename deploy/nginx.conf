# Include these locations inside the HTTPS server block that proxies Koonj.
# Use the same backend for both routes because each SSE session lives on its origin instance.
location = /api/v1/mcp/sse {
    proxy_pass http://koonj_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding on;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    gzip off;
    access_log off;
}

location = /api/v1/mcp/message {
    proxy_pass http://koonj_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    client_max_body_size 64k;
}
