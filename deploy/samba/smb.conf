[global]
    server role = standalone server
    server min protocol = SMB2
    map to guest = Never
    load printers = no
    disable spoolss = yes
    smb ports = 445

[Koonj]
    path = /mnt/koonj-share
    valid users = koonj
    guest ok = no
    read only = yes
    ea support = yes
    vfs objects = offline
    csc policy = disable
