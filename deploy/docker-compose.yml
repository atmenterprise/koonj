services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: koonj
      POSTGRES_USER: ${KOONJ_DB_USERNAME:-koonj}
      POSTGRES_PASSWORD: ${KOONJ_DB_PASSWORD:-password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    ports:
      - "${KOONJ_PG_PORT:-5432}:5432"
    volumes:
      - koonj_pgdata18:/var/lib/postgresql
      - ./keycloak/init-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ..
      dockerfile: deploy/keycloak/Dockerfile
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_HOSTNAME: ${KOONJ_KEYCLOAK_URL:-http://localhost:8180}
    ports:
      - "127.0.0.1:${KOONJ_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/koonj-realm.json:/opt/keycloak/data/import/koonj-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /realms/koonj/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r version code rest <&3; test "$$code" = 200'
      interval: 5s
      timeout: 4s
      retries: 40

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "127.0.0.1:${KOONJ_S3_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${KOONJ_LOCAL_REGION:-eu-west-2}
      - KOONJ_LOCAL_BUCKET=${KOONJ_LOCAL_BUCKET:-koonj-local-archive}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket "$$KOONJ_LOCAL_BUCKET"']
      interval: 5s
      timeout: 4s
      retries: 30

  koonj-fuse:
    profiles: ["fuse", "smb"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fuse
    depends_on:
      keycloak:
        condition: service_healthy
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KOONJ_FUSE_BACKING_DIR: /mnt/koonj-backing
      KOONJ_FUSE_MOUNT_POINT: /mnt/koonj-share
      KOONJ_FUSE_ALLOW_OTHER: ${KOONJ_FUSE_ALLOW_OTHER:-true}
      KOONJ_FUSE_RECALL_ON_READ: "true"
      KOONJ_SERVER_URL: ${KOONJ_SERVER_URL:-http://host.docker.internal:8080}
      KOONJ_AGENT_TOKEN_URI: ${KOONJ_AGENT_TOKEN_URI:-http://keycloak:8080/realms/koonj/protocol/openid-connect/token}
      KOONJ_AGENT_CLIENT_ID: ${KOONJ_AGENT_CLIENT_ID:-koonj-agent}
      KOONJ_AGENT_PROJECT_ID: ${KOONJ_AGENT_PROJECT_ID:-}
      KOONJ_AGENT_CLIENT_SECRET: ${KOONJ_AGENT_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${KOONJ_FUSE_BACKING_DIR:-/srv/koonj/backing}
        target: /mnt/koonj-backing
        bind:
          create_host_path: false
      - type: bind
        source: ${KOONJ_FUSE_MOUNT_POINT:-/srv/koonj/share}
        target: /mnt/koonj-share
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(stat -f -c %t /mnt/koonj-share)" = 65735546']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  koonj-smb:
    profiles: ["smb"]
    image: quay.io/samba.org/samba-server:latest
    restart: unless-stopped
    init: true
    depends_on:
      koonj-fuse:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/sh", "/etc/koonj-smb/start.sh"]
    environment:
      KOONJ_SMB_PASSWORD: ${KOONJ_SMB_PASSWORD:-}
    ports:
      - "${KOONJ_SMB_BIND:-127.0.0.1}:${KOONJ_SMB_PORT:-445}:445"
    volumes:
      - ./samba:/etc/koonj-smb:ro
      - type: bind
        source: ${KOONJ_FUSE_MOUNT_POINT:-/srv/koonj/share}
        target: /mnt/koonj-share
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave

volumes:
  koonj_pgdata18:
  localstack_data:
