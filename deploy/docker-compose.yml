services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: koonj
      POSTGRES_USER: koonj
      POSTGRES_PASSWORD: password
    ports:
      - "${KOONJ_PG_PORT:-5432}:5432"
    volumes:
      - koonj_pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koonj"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "127.0.0.1:${KOONJ_S3_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${KOONJ_LOCAL_REGION:-eu-west-2}
      - KOONJ_LOCAL_BUCKET=${KOONJ_LOCAL_BUCKET:-koonj-local-archive}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket "$$KOONJ_LOCAL_BUCKET"']
      interval: 5s
      timeout: 4s
      retries: 30

  koonj-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args: { MODULE: koonj-api }
    environment:
      KOONJ_JDBC_URL: jdbc:postgresql://postgres:5432/koonj
      KOONJ_CONNECTION_ALLOWED_S3_ENDPOINTS: ${KOONJ_CONNECTION_ALLOWED_S3_ENDPOINTS:-http://localstack:4566}
    volumes:
      - ${KOONJ_ROOT_PATH:-./data}:/mnt/koonj:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  koonj-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args: { MODULE: koonj-worker }
    environment:
      KOONJ_JDBC_URL: jdbc:postgresql://postgres:5432/koonj
      KOONJ_S3_ENDPOINT: http://localstack:4566
      KOONJ_S3_PATHSTYLE: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ${KOONJ_LOCAL_REGION:-eu-west-2}
    volumes:
      - ${KOONJ_ROOT_PATH:-./data}:/mnt/koonj
      - worker_staging:/var/lib/koonj/staging
    depends_on:
      koonj-api: { condition: service_healthy }
      localstack: { condition: service_healthy }

  koonj-ui:
    build:
      context: ../koonj-ui
    ports:
      - "127.0.0.1:${KOONJ_UI_PORT:-8080}:80"
    depends_on:
      koonj-api: { condition: service_healthy }

volumes:
  worker_staging:
  koonj_pgdata18:
  localstack_data:
