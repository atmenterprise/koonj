services:
  postgres:
    image: postgres:18-alpine
    container_name: koonj-db
    environment:
      POSTGRES_DB: koonj
      POSTGRES_USER: koonj
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - koonj_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koonj"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: koonj-s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=eu-west-2
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  koonj_pgdata:
  localstack_data: