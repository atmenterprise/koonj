# =============================================================================
# Koonj — Production Docker Compose
# =============================================================================
# Deploys the full Koonj stack:
#   - PostgreSQL   (database)
#   - Keycloak     (identity & access management)
#   - koonj-server (API)
#   - koonj-ui     (Nginx + React SPA)
#
# Usage:
#   cp .env.example .env        # review and customise all values
#   docker compose up -d --build --wait
#
# Scaling:
#   docker compose up -d --scale koonj-server=3
#   docker compose up -d --scale koonj-ui=2
# =============================================================================

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KOONJ_DB_NAME:-koonj}
      POSTGRES_USER: ${KOONJ_DB_USERNAME:-koonj}
      POSTGRES_PASSWORD: ${KOONJ_DB_PASSWORD:?Set KOONJ_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "${KOONJ_PG_BIND:-127.0.0.1}:${KOONJ_PG_PORT:-5432}:5432"
    volumes:
      - koonj_pgdata:/var/lib/postgresql
      - ./keycloak/init-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - koonj-internal

  # ── Identity & Access Management ───────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KOONJ_KEYCLOAK_EXTERNAL_URL:?Set KOONJ_KEYCLOAK_EXTERNAL_URL in .env}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    ports:
      - "${KOONJ_KEYCLOAK_BIND:-127.0.0.1}:${KOONJ_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/koonj-realm.json:/opt/keycloak/data/import/koonj-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r version code rest <&3; test "$$code" = 200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - koonj-internal

  # ── API Server ─────────────────────────────────────────────────────────────
  koonj-server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    image: koonj-server:${KOONJ_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      KOONJ_DB_URL: "jdbc:postgresql://postgres:5432/${KOONJ_DB_NAME:-koonj}?reWriteBatchedInserts=true"
      KOONJ_DB_USERNAME: ${KOONJ_DB_USERNAME:-koonj}
      KOONJ_DB_PASSWORD: ${KOONJ_DB_PASSWORD}
      KOONJ_DDL_AUTO: ${KOONJ_DDL_AUTO:-update}
      KOONJ_AUTH_ISSUER_URI: "${KOONJ_KEYCLOAK_EXTERNAL_URL:?Set KOONJ_KEYCLOAK_EXTERNAL_URL in .env}/realms/koonj"
      KOONJ_AUTH_JWK_SET_URI: "http://keycloak:8080/realms/koonj/protocol/openid-connect/certs"
      KOONJ_CORS_ALLOWED_ORIGINS: ${KOONJ_CORS_ALLOWED_ORIGINS:-http://localhost}
      KOONJ_BASIC_AUTH_ENABLED: ${KOONJ_BASIC_AUTH_ENABLED:-false}
      KOONJ_BASIC_AUTH_USERNAME: ${KOONJ_BASIC_AUTH_USERNAME:-}
      KOONJ_BASIC_AUTH_PASSWORD: ${KOONJ_BASIC_AUTH_PASSWORD:-}
      KOONJ_BASIC_AUTH_ROLE: ${KOONJ_BASIC_AUTH_ROLE:-KOONJ_VIEWER}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ${KOONJ_DATA_MOUNT:-${KOONJ_FUSE_BACKING_DIR:-./data}}:/mnt/koonj:rw
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${KOONJ_SERVER_MEMORY:-2G}
      # Scale with: docker compose up -d --scale koonj-server=N
    networks:
      - koonj-internal

  # ── UI (Nginx + React SPA) ────────────────────────────────────────────────
  koonj-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.ui
    image: koonj-ui:${KOONJ_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      koonj-server:
        condition: service_healthy
    environment:
      KOONJ_API_UPSTREAM: "koonj-server:8080"
    ports:
      - "${KOONJ_UI_BIND:-0.0.0.0}:${KOONJ_UI_PORT:-80}:80"
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:80/']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
      # Scale with: docker compose up -d --scale koonj-ui=N
    networks:
      - koonj-internal

  # Optional FUSE gateway (Linux hosts)
  koonj-fuse:
    profiles: ["fuse", "smb"]
    restart: unless-stopped
    build:
      context: ./fuse
      dockerfile: Dockerfile.fuse
    image: koonj-fuse:${KOONJ_VERSION:-latest}
    depends_on:
      koonj-server:
        condition: service_healthy
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      KOONJ_FUSE_BACKING_DIR: /mnt/koonj-backing
      KOONJ_FUSE_MOUNT_POINT: /mnt/koonj-share
      KOONJ_FUSE_ALLOW_OTHER: ${KOONJ_FUSE_ALLOW_OTHER:-true}
      KOONJ_FUSE_RECALL_ON_READ: "true"
      KOONJ_SERVER_URL: http://koonj-server:8080
      KOONJ_AGENT_TOKEN_URI: ${KOONJ_AGENT_TOKEN_URI:-http://keycloak:8080/realms/koonj/protocol/openid-connect/token}
      KOONJ_AGENT_CLIENT_ID: ${KOONJ_AGENT_CLIENT_ID:-koonj-agent}
      KOONJ_AGENT_CLIENT_SECRET: ${KOONJ_AGENT_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${KOONJ_DATA_MOUNT:-${KOONJ_FUSE_BACKING_DIR:-/srv/koonj/backing}}
        target: /mnt/koonj-backing
        bind:
          create_host_path: false
      - type: bind
        source: ${KOONJ_FUSE_MOUNT_POINT:-/srv/koonj/share}
        target: /mnt/koonj-share
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(stat -f -c %t /mnt/koonj-share)" = 65735546']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - koonj-internal

  koonj-smb:
    profiles: ["smb"]
    image: quay.io/samba.org/samba-server:latest
    restart: unless-stopped
    init: true
    depends_on:
      koonj-fuse:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/sh", "/etc/koonj-smb/start.sh"]
    environment:
      KOONJ_SMB_PASSWORD: ${KOONJ_SMB_PASSWORD:-}
    ports:
      - "${KOONJ_SMB_BIND:-127.0.0.1}:${KOONJ_SMB_PORT:-445}:445"
    volumes:
      - ./samba:/etc/koonj-smb:ro
      - type: bind
        source: ${KOONJ_FUSE_MOUNT_POINT:-/srv/koonj/share}
        target: /mnt/koonj-share
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
    networks:
      - koonj-internal

volumes:
  koonj_pgdata:
    driver: local

networks:
  koonj-internal:
    driver: bridge
