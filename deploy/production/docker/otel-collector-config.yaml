# =============================================================================
# OpenTelemetry Collector Configuration for Koonj
# =============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Spring Boot Actuator Prometheus metrics endpoint
  prometheus:
    config:
      scrape_configs:
        - job_name: 'koonj-server'
          scrape_interval: 15s
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets: ['koonj-server:8080']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  # Debug / Logging exporter (useful for verifying trace and metric flow in stdout)
  debug:
    verbosity: basic

  # Forward traces to Jaeger or Grafana Tempo
  otlp/tempo:
    endpoint: ${TEMPO_ENDPOINT:-tempo:4317}
    tls:
      insecure: true

  # Export metrics to Prometheus or Grafana Mimir
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: koonj

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/tempo]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]

  telemetry:
    logs:
      level: info
