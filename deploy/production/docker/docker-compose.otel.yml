# =============================================================================
# Koonj — Docker Compose with OpenTelemetry & Grafana Observability
# =============================================================================
# Extends the standard Koonj stack with:
#   - OpenTelemetry Collector (ingests OTLP traces & scrapes Prometheus metrics)
#   - Grafana Tempo (distributed tracing storage)
#   - Prometheus (time-series metrics storage)
#   - Grafana (dashboards for metrics and traces)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up -d --build
# =============================================================================

services:
  koonj-server:
    environment:
      OTEL_JAVAAGENT_ENABLED: "true"
      OTEL_SERVICE_NAME: "koonj-server"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_EXPORTER: "otlp"
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "8889:8889"     # Prometheus metrics exporter
    networks:
      - koonj-internal

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"     # Tempo HTTP
    networks:
      - koonj-internal

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - koonj-internal

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - koonj-internal

volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
