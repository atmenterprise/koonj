# Use with docker-compose.yml from this directory.
# docker compose -f docker-compose.yml -f docker-compose.otel.yml up -d --build --wait
services:
  koonj-server:
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://openobserve:5080/api/default/v1/metrics
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://openobserve:5080/api/default/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OPENOBSERVE_AUTHORIZATION: ${OPENOBSERVE_AUTHORIZATION:?Set OPENOBSERVE_AUTHORIZATION in .env}
    depends_on:
      openobserve:
        condition: service_started

  openobserve:
    extends:
      file: openobserve.compose.yml
      service: openobserve
    networks:
      - koonj-internal

volumes:
  openobserve_data:
