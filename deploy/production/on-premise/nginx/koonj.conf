# =============================================================================
# Koonj — Nginx Reverse Proxy (On-Premise)
# =============================================================================
# Install to /etc/nginx/conf.d/koonj.conf
# Reload: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream koonj_api {
    server 127.0.0.1:8080;
    # server 127.0.0.1:8081;   # additional instance for scaling
    # server 10.0.0.2:8080;    # remote instance
    keepalive 32;
}

server {
    listen       80;
    server_name  _;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/koonj.crt;
    # ssl_certificate_key /etc/ssl/private/koonj.key;

    root /opt/koonj/web;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://koonj_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1G;
    }

    location /actuator/health {
        proxy_pass http://koonj_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
