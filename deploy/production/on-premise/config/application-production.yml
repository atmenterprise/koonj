# =============================================================================
# Koonj Server — Production Spring Boot Configuration
# =============================================================================
# Supplements the embedded application.yml. Environment variables take
# highest precedence (12-factor style).
# =============================================================================

spring:
  datasource:
    hikari:
      maximum-pool-size: ${KOONJ_DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${KOONJ_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        url: ${MANAGEMENT_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

server:
  port: ${KOONJ_SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-threads: ${KOONJ_MAX_THREADS:200}
    accept-count: 100
    connection-timeout: 20000

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

logging:
  level:
    root: WARN
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
